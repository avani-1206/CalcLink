<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalcInk</title>
<meta name="description" content="On-device handwritten math calculator — write an equation, get the answer inline. Works offline.">
<meta name="theme-color" content="#f7f3e8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="bar" role="toolbar" aria-label="Tools">

  <!-- tool buttons -->
  <button class="btn" id="tPen"  aria-pressed="true"  title="Pen (P)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="t">Pen</span>
  </button>
  <button class="btn" id="tHL"   aria-pressed="false" title="Highlighter (H) — ignored by the recogniser">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg><span class="t">Highlight</span>
  </button>
  <button class="btn" id="tPE"   aria-pressed="false" title="Pixel eraser (E)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16l10-10 7 7-3 3"/><path d="m6.5 17.5 3-3"/></svg><span class="t">Eraser</span>
  </button>
  <button class="btn" id="tSE"   aria-pressed="false" title="Stroke eraser (S)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg><span class="t">Stroke</span>
  </button>

  <div class="sep"></div>

  <!-- palette: "ink" is a special colour that flips with dark mode -->
  <div id="palette">
    <button class="sw on"  style="background:var(--C-ink)" data-c="ink" title="Ink (adapts to dark mode)"></button>
    <button class="sw"     style="background:#e63946" data-c="#e63946" title="Red"></button>
    <button class="sw"     style="background:#2a9d8f" data-c="#2a9d8f" title="Teal"></button>
    <button class="sw"     style="background:#e9c46a" data-c="#e9c46a" title="Yellow"></button>
    <button class="sw"     style="background:#6c63ff" data-c="#6c63ff" title="Purple"></button>
    <button class="sw"     style="background:#f4a261" data-c="#f4a261" title="Orange"></button>
    <input type="color" id="cp" value="#1d2a44" title="Custom">
  </div>

  <div class="sep"></div>

  <div class="group">
    <label for="wSlider">Size</label>
    <input id="wSlider" type="range" min="1" max="32" value="4">
    <span class="val" id="wVal">4</span>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label for="oSlider">Opacity</label>
    <input id="oSlider" type="range" min="5" max="100" value="100">
    <span class="val" id="oVal">100%</span>
  </div>

  <div class="sep"></div>

  <button class="btn" id="bUndo" disabled title="Undo (Ctrl+Z)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="t">Undo</span>
  </button>
  <button class="btn" id="bRedo" disabled title="Redo (Ctrl+Y)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span class="t">Redo</span>
  </button>
  <button class="btn" id="bClear" title="Clear">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg><span class="t">Clear</span>
  </button>

  <div class="sep"></div>

  <button class="btn" id="bRec" aria-pressed="false" title="Show what the model reads (R)">
    <span class="dot" id="mDot" data-s="loading"></span><span class="t">Show reads</span>
  </button>
  <button class="btn" id="bSteps" aria-pressed="false" title="Show BODMAS steps under each answer (T)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg><span class="t">Steps</span>
  </button>
  <button class="btn" id="bSound" aria-pressed="false" title="Sound feedback when an answer appears">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="iWave" d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
  </button>

  <div class="sep"></div>

  <button class="btn" id="bExport" title="Export PNG">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="t">Export</span>
  </button>
  <button class="btn" id="bDark" title="Dark mode">
    <svg id="iMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="iSun"  width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div id="stage">
  <canvas id="ink"></canvas>
  <div id="hint"><b>12 + 7 =</b>Write a sum ending with “=” — the answer appears beside it.<br>Try x = 5, powers like 2³, or y = 2x + 1. Scribble over ink to erase.</div>
  <div id="results"></div>
  <div id="labels"></div>
  <div id="ring"></div>
  <div id="toast"></div>
</div>

<!-- App code: plain scripts, loaded in order. No build step needed to run. -->
<script src="src/core/calcink-core.js"></script>   <!-- pure logic: geometry, parser, evaluator -->
<script src="src/app/canvas.js"></script>          <!-- Phase 1: ink canvas, erasers, undo/redo, scratch gesture -->
<script src="src/app/recognizer.js"></script>      <!-- Phase 2: rasterise symbols, talk to the worker -->
<script src="src/app/projection.js"></script>      <!-- Phase 4: answers, graphs, debug labels -->
<script src="src/app/main.js"></script>            <!-- wiring: scheduling, keyboard, offline -->
</body>
</html>
